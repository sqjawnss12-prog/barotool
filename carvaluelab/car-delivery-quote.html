/">중고차 잔존가치 계산</a><a href="/carvaluelab/lease-vs-long-rental.html">리스 vs 장기렌트</a><a href="/quote-workshop/">견적공방</a><a href="/qr/">QR공방</a></div></section></main><script>const g=document.getElementById('grid');for(let i=1;i<=3;i++)g.insertAdjacentHTML('beforeend',`<div class="q" id="q${i}"><h3>업체 ${i}</h3><label>기본 탁송비</label><input class="base" type="number" placeholder="원"><label>보험·캐리어 등 옵션</label><input class="opt" type="number" placeholder="원"><label>야간·주말·제주 등 추가비</label><input class="extra" type="number" placeholder="원"><div class="total">0원</div></div>`);function calc(){let a=[];document.querySelectorAll('.q').forEach((q,i)=>{q.classList.remove('best');let v=[...q.querySelectorAll('input')].reduce((s,e)=>s+(Number(e.value)||0),0);q.querySelector('.total').textContent=v.toLocaleString('ko-KR')+'원';if(v>0)a.push([v,i])});if(a.length){a.sort((x,y)=>x[0]-y[0]);document.getElementById('q'+(a[0][1]+1)).classList.add('best');result.textContent=`현재 입력 기준 최저 총액은 업체 ${a[0][1]+1}의 ${a[0][0].toLocaleString('ko-KR')}원입니다.${a.length>1?' 최고 견적과 차이는 '+(a[a.length-1][0]-a[0][0]).toLocaleString('ko-KR')+'원입니다.':''}`}else result.textContent='받은 견적을 입력하면 총액을 자동 비교합니다.'}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',calc));calc()</script></body></html>
