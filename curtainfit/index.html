<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커튼핏 - 커튼 사이즈 계산기</title><meta name="description" content="창문 폭과 높이, 주름 배수, 패널 수를 입력해 커튼 폭과 길이를 계산합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/curtainfit/"><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="hero"><h1>커튼핏</h1><p>커튼 폭·길이 무료 계산기</p></section><section class="panel"><label>창문 폭(cm)<input id="w" type="number" value="240"></label><label>창문 높이(cm)<input id="h" type="number" value="220"></label><label>주름 배수<input id="f" type="number" step="0.1" value="2"></label><label>패널 수<input id="p" type="number" value="2"></label><button id="b">계산</button><div id="o" aria-live="polite"></div></section><section class="panel"><h2>사용 안내</h2><p>전체 폭은 창문 폭에 주름 배수를 곱해 계산하며, 패널당 폭은 전체 폭을 패널 수로 나눕니다. 실제 주문 전에는 레일 위치, 시접, 원단 폭을 판매처 기준으로 확인하세요.</p><p><a href="/">바로툴로 돌아가기</a> · <a href="/tilefit/">타일핏</a></p></section></main><script>function c(){const w=+document.getElementById('w').value,h=+document.getElementById('h').value,f=+document.getElementById('f').value,p=+document.getElementById('p').value,o=document.getElementById('o');if(w<=0||h<=0||f<=0||p<1){o.textContent='입력값을 확인해 주세요.';return}const t=w*f;o.innerHTML='<h2>전체 폭 '+Math.ceil(t)+' cm</h2><p>패널당 폭 '+Math.ceil(t/p)+' cm × '+p+'장</p><p>기본 길이 '+Math.ceil(h)+' cm</p>'}document.getElementById('b').onclick=c;c();</script></body></html>
