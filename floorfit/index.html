<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마루·장판 수량 계산기 - 플로어핏</title><meta name="description" content="방 가로·세로와 바닥재 규격, 박스당 시공면적, 여유율을 입력해 마루·장판·데코타일 필요 수량과 박스 수, 예상 자재비를 계산합니다."><meta name="robots" content="index,follow"><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/floorfit/"><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="hero"><span class="badge">무료 · 설치 없음 · 브라우저 계산</span><h1>플로어핏</h1><p>실측 면적과 제품 포장 정보를 넣으면 마루·장판·데코타일 구매 수량을 바로 계산합니다.</p></section><section class="panel"><h2>바닥재 수량 계산</h2><label>방 가로(m)<input id="w" type="number" min="0" step="0.01" value="4"></label><label>방 세로(m)<input id="d" type="number" min="0" step="0.01" value="3.5"></label><label>같은 크기 공간 수<input id="rooms" type="number" min="1" value="1"></label><label>여유율(%)<input id="waste" type="number" min="0" max="50" value="10"></label><label>제품 1박스 시공면적(㎡)<input id="boxArea" type="number" min="0" step="0.01" value="1.8"></label><label>1박스 가격(원, 선택)<input id="price" type="number" min="0" value="0"></label><button id="calc">계산하기</button><div id="result"></div></section><section class="panel"><h2>구매와 시공비를 함께 비교하세요</h2><p>직접 구매 수량을 계산한 뒤 업체 시공까지 맡길 예정이라면 <a href="/quote-workshop/vinyl-flooring-cost.html"><strong>장판 시공 비용 계산기</strong></a>에서 실제 시공 평수·두께·철거비를 기준으로 총예산을 비교할 수 있습니다.</p><p><a href="/areafit/">면적핏</a> · <a href="/wallfit/">도배핏</a> · <a href="/quote-workshop/">견적공방</a> · <a href="/">바로툴</a></p></section></main><script>const $=id=>document.getElementById(id),fmt=(n,d=2)=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d});function calc(){const w=+$('w').value,d=+$('d').value,rooms=+$('rooms').value,waste=+$('waste').value,boxArea=+$('boxArea').value,price=+$('price').value,r=$('result');if(w<=0||d<=0||rooms<1||boxArea<=0){r.textContent='입력값을 확인해 주세요.';return}const area=w*d*rooms,target=area*(1+waste/100),boxes=Math.ceil(target/boxArea),cost=boxes*price;r.innerHTML=`<h2>필요 수량 ${boxes.toLocaleString('ko-KR')}박스</h2><p>실측 ${fmt(area)}㎡ · 여유율 포함 ${fmt(target)}㎡</p>${price>0?`<p>예상 자재비 <strong>${cost.toLocaleString('ko-KR')}원</strong></p>`:''}`} $('calc').onclick=calc;['w','d','rooms','waste','boxArea','price'].forEach(id=>$(id).oninput=calc);calc();</script></body></html>
