<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>손익분기 ROAS 계산기 - 본전 ROAS 계산 | 마케팅셈</title><meta name="description" content="상품 총마진율과 수수료·기타 변동비율을 입력해 광고 손익분기 ROAS와 기여이익률을 계산합니다."><meta name="robots" content="index,follow"><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/marketing/breakeven-roas.html"><link rel="stylesheet" href="/marketing/styles.css"></head><body data-tool="breakeven"><header class="header"><div class="wrap nav"><a class="brand" href="/marketing/">마케팅<span>셈</span></a><nav class="navlinks"><a href="/marketing/">계산기</a><a href="/marketing/about.html">소개</a></nav></div></header><main class="tool"><a class="back" href="/marketing/">← 모든 계산기</a><div class="tool-head"><h1>손익분기 ROAS 계산기</h1><p>광고를 집행했을 때 본전이 되는 최소 ROAS를 계산합니다.</p></div><div id="tool-root"></div><article class="seo"><h2>손익분기 ROAS란?</h2><p>광고로 발생한 매출에서 상품 원가와 판매 관련 변동비, 광고비까지 지불하고 이익이 0이 되는 ROAS입니다.</p><h2>계산 원리</h2><p><strong>손익분기 ROAS = 100 ÷ 기여이익률</strong>로 계산합니다. 예를 들어 광고 전 기여이익률이 25%라면 손익분기 ROAS는 약 400%입니다.</p></article></main><footer class="footer"><div class="wrap footer-inner"><div>© 2026 마케팅셈</div><div><a href="/marketing/privacy.html">개인정보처리방침</a></div></div></footer><script src="/marketing/app.js"></script></body></html>
