<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로젝트 수익률·실질 시급 계산기 - 마케팅셈</title><meta name="description" content="프로젝트 매출, 외주비, 직접비, 작업시간을 넣어 순이익, 이익률, 실질 시간당 수익을 계산하고 프로젝트 A/B 수익성을 비교합니다."><meta name="robots" content="index,follow"><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/marketing/project-profit.html"><link rel="stylesheet" href="/marketing/styles.css"><style>.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mini{background:#fff;border:1px solid #e3e7ee;border-radius:18px;padding:20px}.mini h2{margin-top:0}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:13px;font-weight:800}.f input{width:100%;padding:11px;border:1px solid #d9dee8;border-radius:10px;font:inherit;margin-top:5px}.out{margin-top:14px;background:#f6f8fb;border-radius:12px;padding:14px;line-height:1.8}.winner{margin:18px 0;background:#13233b;color:#fff;border-radius:14px;padding:17px;font-weight:800}.related{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 42px}.related a{padding:10px 13px;border:1px solid #dfe4ec;border-radius:999px;text-decoration:none;background:#fff}@media(max-width:720px){.compare,.f{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="wrap nav"><a class="brand" href="/marketing/">마케팅<span>셈</span></a><nav class="navlinks"><a href="/marketing/">계산기</a><a href="/quote-workshop/">견적공방</a><a href="/">바로툴</a></nav></div></header><main><section class="wrap tool-hero"><span class="badge">외주·에이전시·프리랜서</span><h1>프로젝트 수익률·실질 시급 계산기</h1><p>견적 금액이 커도 투입시간과 외주비가 많으면 실제 수익성은 낮을 수 있습니다. 프로젝트 A/B의 순이익, 이익률, 실질 시간당 수익을 함께 비교하세요.</p></section><section class="wrap"><div class="compare"><div class="mini"><h2>프로젝트 A</h2><div class="f"><label>매출<input id="aRev" type="number" value="3000000"></label><label>외주·직접비<input id="aCost" type="number" value="700000"></label><label>총 작업시간<input id="aHours" type="number" value="50"></label><label>기타 고정비 배분<input id="aFixed" type="number" value="200000"></label></div><div class="out" id="aOut"></div></div><div class="mini"><h2>프로젝트 B</h2><div class="f"><label>매출<input id="bRev" type="number" value="4500000"></label><label>외주·직접비<input id="bCost" type="number" value="1800000"></label><label>총 작업시간<input id="bHours" type="number" value="90"></label><label>기타 고정비 배분<input id="bFixed" type="number" value="300000"></label></div><div class="out" id="bOut"></div></div></div><div class="winner" id="winner"></div><p>계산식은 순이익 = 매출 − 외주·직접비 − 고정비 배분, 이익률 = 순이익 ÷ 매출, 실질 시간당 수익 = 순이익 ÷ 총 작업시간입니다. 세금은 사업자별 상황 차이가 커 자동 반영하지 않습니다.</p><div class="related"><a href="/quote-workshop/hourly-rate.html">내 최소 시급 계산 →</a><a href="/quote-workshop/">프로젝트 견적 계산 →</a><a href="/marketing/break-even-sales.html">손익분기 매출 →</a></div></section></main><script>const v=id=>Math.max(0,Number(document.getElementById(id).value)||0),w=x=>Math.round(x).toLocaleString('ko-KR')+'원';function one(p){const rev=v(p+'Rev'),cost=v(p+'Cost'),hours=v(p+'Hours'),fixed=v(p+'Fixed'),profit=rev-cost-fixed,margin=rev?profit/rev*100:0,rate=hours?profit/hours:0;document.getElementById(p+'Out').innerHTML='<b>순이익 '+w(profit)+'</b><br>이익률 '+margin.toFixed(1)+'%<br>실질 시간당 수익 '+w(rate);return{profit,margin,rate}}function calc(){const a=one('a'),b=one('b');const win=a.rate===b.rate?'두 프로젝트의 시간당 수익이 같습니다.':(a.rate>b.rate?'프로젝트 A':'프로젝트 B')+'가 시간당 수익 기준으로 더 효율적입니다.';document.getElementById('winner').textContent=win}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
