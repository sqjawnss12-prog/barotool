<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포장이사 업체 견적 비교 | 바로툴</title><meta name="description" content="포장이사 업체 3곳의 기본견적, 사다리차, 인력, 에어컨·가전 이전, 추가요금 조건을 한 번에 비교합니다."><style>body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#171717;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}a{color:#3157d5}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,select{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px;border:1px solid #ccd1da;border-radius:9px}button{border:0;border-radius:10px;padding:12px 18px;background:#111827;color:white;font-weight:700}.result{font-size:18px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:25px}}</style></head><body><main class="wrap"><p><a href="/">← 바로툴 다른 무료 도구</a></p><h1>포장이사 업체 3곳 견적 비교</h1><p>총액만 보지 말고 사다리차·추가 인력·가전 이전·주말 할증까지 같은 조건으로 비교하세요.</p><div class="card"><label>이사 규모<select id="size"><option value="1">원룸·1톤</option><option value="2.5">투룸·2.5톤</option><option value="5" selected>3룸·5톤</option><option value="7.5">대형·7.5톤+</option></select></label><label>이사 거리(km)<input id="distance" type="number" value="20" min="0"></label><label><input id="weekend" type="checkbox" style="width:auto"> 주말·성수기 일정</label></div><div class="grid" id="vendors"></div><button onclick="compare()">견적 비교하기</button><div class="card result" id="result">업체별 금액과 포함 조건을 입력하세요.</div><div class="card"><b>견적 전에 꼭 확인</b><p>방문견적 후 확정금액인지, 사다리차·엘리베이터 사용료, 추가 인력, 에어컨/벽걸이TV 이전, 폐기물 처리, 당일 추가요금 발생 조건을 서면으로 확인하는 편이 안전합니다.</p><p><a href="/">바로툴 홈에서 다른 생활 계산기 보기 →</a></p></div></main><script>const box=document.getElementById('vendors');for(let i=1;i<=3;i++)box.innerHTML+=`<div class="card"><b>업체 ${i}</b><input id="name${i}" placeholder="업체명 (선택)"><input id="base${i}" type="number" placeholder="기본 견적(원)"><input id="ladder${i}" type="number" placeholder="사다리차/승강기 추가(원)" value="0"><input id="extra${i}" type="number" placeholder="기타 추가비(원)" value="0"><label><input id="written${i}" type="checkbox" style="width:auto"> 추가요금 조건 서면확인</label><label><input id="appliance${i}" type="checkbox" style="width:auto"> 가전 이전 포함</label></div>`;function won(n){return Math.round(n).toLocaleString()+'원'}function compare(){let arr=[];for(let i=1;i<=3;i++){let b=+document.getElementById('base'+i).value;if(!b)continue;let total=b+(+document.getElementById('ladder'+i).value||0)+(+document.getElementById('extra'+i).value||0);let score=(document.getElementById('written'+i).checked?2:0)+(document.getElementById('appliance'+i).checked?1:0);arr.push({n:document.getElementById('name'+i).value||'업체 '+i,total,score})}if(!arr.length){result.textContent='최소 한 업체의 기본 견적을 입력하세요.';return}arr.sort((a,b)=>a.total-b.total);let safest=[...arr].sort((a,b)=>b.score-a.score||a.total-b.total)[0];result.innerHTML=`<b>총액 최저:</b> ${arr[0].n} · ${won(arr[0].total)}<br><b>조건 확인 우선:</b> ${safest.n} · ${won(safest.total)}<hr>`+arr.map(x=>`${x.n}: ${won(x.total)} · 조건확인 ${x.score}/3`).join('<br>')+`<p style="font-size:14px">규모·거리·일정은 견적을 받을 때 세 업체 모두 동일하게 전달하세요. 실제 가격은 짐량·거리·층수·날짜·현장조건에 따라 달라집니다.</p>`}</script></body></html>
