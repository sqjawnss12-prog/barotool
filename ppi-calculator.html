<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPI 계산기 - 화면 픽셀 밀도 계산 | 바로툴</title><meta name="description" content="화면의 가로·세로 해상도와 대각선 크기로 PPI(인치당 픽셀 수)를 계산하는 무료 도구."><link rel="stylesheet" href="/styles.css"></head><body data-tool="ppi"><header class="header"><div class="wrap nav"><a class="brand" href="/">바로<span>툴</span></a><nav class="navlinks"><a href="/">모든 도구</a><a href="/aspect-ratio.html">화면비율 계산기</a><a href="/privacy.html">개인정보처리방침</a></nav></div></header><main class="tool-shell"><a class="back" href="/">← 모든 도구</a><div class="tool-head"><h1>PPI 계산기</h1><p>해상도와 화면 대각선 크기로 픽셀 밀도를 계산합니다.</p></div><div id="tool-root"></div><div class="ad-slot">광고 영역 · AdSense 승인 후 적용</div><article class="seo"><h2>PPI 계산식</h2><p>가로 픽셀과 세로 픽셀로 대각선 픽셀 수를 구한 뒤 화면의 대각선 길이(인치)로 나눕니다.</p><p><strong>PPI = √(가로 픽셀² + 세로 픽셀²) ÷ 화면 대각선(inch)</strong></p><h2>PPI가 높다는 의미</h2><p>같은 화면 크기라면 PPI가 높을수록 픽셀이 더 촘촘하게 배치되어 있다는 뜻입니다.</p></article></main><footer class="footer"><div class="wrap footer-inner"><div>© 2026 바로툴</div><div><a href="/about.html">소개</a> · <a href="/privacy.html">개인정보처리방침</a> · <a href="/contact.html">문의</a></div></div></footer><script src="/app.js"></script></body></html>
