<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에어컨 이전설치 비용 계산기 | 견적공방</title><meta name="description" content="벽걸이·스탠드·투인원 에어컨 이전설치 비용을 철거, 이동, 배관 연장, 냉매, 앵글, 타공 조건까지 반영해 계산합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/aircon-relocation-cost.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#211f1b}.w{max-width:820px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between}.box{background:#fff;border:1px solid #e5dfd4;border-radius:18px;padding:22px;margin:16px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:14px}select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-top:6px}.result{font-size:28px;font-weight:900}.muted{color:#746e65;font-size:14px;line-height:1.65}a{color:#7b3e20}@media(max-width:620px){.g{grid-template-columns:1fr}}</style></head><body><main class="w"><nav class="nav"><b><a href="/quote-workshop/">견적공방</a></b><a href="/">바로툴</a></nav><h1>에어컨 이전설치 비용 계산기</h1><p class="muted">기본 설치비보다 배관·냉매·실외기 작업에서 총액 차이가 커집니다. 조건을 넣어 예산 범위를 먼저 확인하세요.</p><section class="box g"><label>에어컨 종류<select id="type"><option value="170000">벽걸이</option><option value="280000">스탠드</option><option value="390000">투인원</option></select></label><label>추가 배관 길이(m)<input id="pipe" type="number" min="0" value="0"></label><label>냉매 보충<select id="gas"><option value="0">없음/미정</option><option value="80000">필요</option></select></label><label>실외기 앵글·고소작업<select id="out"><option value="0">없음</option><option value="80000">앵글 또는 난간 작업</option><option value="150000">고소·특수 작업 예상</option></select></label><label>추가 타공<select id="hole"><option value="0">없음</option><option value="30000">1회</option><option value="60000">2회</option></select></label><label>운반거리<input id="km" type="number" min="0" value="5"></label></section><section class="box"><div>예상 총비용</div><div class="result" id="total">-</div><p class="muted" id="range"></p></section><section class="box"><b>견적 받을 때 확인할 항목</b><p class="muted">① 기본비에 철거·운반이 포함되는지 ② 기본 배관 길이와 초과 m당 단가 ③ 냉매 보충 조건 ④ 앵글·난간·사다리차 비용 ⑤ 타공과 배수펌프 비용을 각각 확인하세요. 현장 조건에 따라 실제 가격은 달라질 수 있습니다.</p></section><section class="box"><b>같이 계산하기</b><p><a href="/quote-workshop/moving-cost-quote.html">포장이사 비용 →</a> · <a href="/quote-workshop/aircon-cleaning-cost.html">에어컨 청소 비용 →</a> · <a href="/quote-workshop/">다른 생활 견적 계산기 →</a></p></section><script>const ids=['type','pipe','gas','out','hole','km'];function calc(){let base=+type.value, p=Math.max(0,+pipe.value||0)*18000, move=Math.max(0,(+km.value||0)-10)*2000;let t=base+p+(+gas.value)+(+out.value)+(+hole.value)+move;total.textContent=t.toLocaleString('ko-KR')+'원';range.textContent='비교용 범위: 약 '+Math.round(t*.85).toLocaleString('ko-KR')+'원 ~ '+Math.round(t*1.2).toLocaleString('ko-KR')+'원. 업체별 기본 포함 범위가 달라 세부항목을 함께 비교하세요.'}ids.forEach(x=>document.getElementById(x).addEventListener('input',calc));calc()</script></main></body></html>
