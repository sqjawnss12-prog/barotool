<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>붙박이장 업체 3곳 견적 비교 2026 | 견적공방</title><meta name="description" content="붙박이장 업체 3곳 견적을 총액, 길이당 가격, 철거·폐기, 내부 구성, 마감, A/S와 추가금 위험까지 비교합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/built-in-closet-quote-compare.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#211d19}.w{max-width:960px;margin:auto;padding:24px}a{color:#7b3e20}.hero{padding:28px 0}.card{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.q{background:#faf8f4;border-radius:14px;padding:14px}.q input[type=number]{width:100%;padding:10px;margin:6px 0;border:1px solid #d9d2c6;border-radius:9px}.q label{display:block;font-size:13px;margin:6px 0}.best{outline:3px solid #a4562a}.result{font-size:18px;font-weight:800}.small{font-size:13px;color:#706a62;line-height:1.6}.links{line-height:2}button{border:0;border-radius:10px;padding:11px 14px;background:#7b3e20;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a><section class="hero"><small>2026 붙박이장 견적 비교</small><h1>붙박이장 업체 3곳 견적 비교</h1><p>총액뿐 아니라 길이당 가격과 철거·폐기·내부구성·마감·A/S, 현장 추가금 위험까지 같이 봅니다.</p></section><section class="card"><h2>업체별 견적 입력</h2><div class="grid" id="grid"></div><p class="small">같은 벽면·비슷한 내부구성 기준으로 비교하세요. 점수는 견적 누락을 찾기 위한 보조지표이며 실제 시공 품질을 보장하지 않습니다.</p></section><section class="card"><h2>비교 결과</h2><div id="result" class="result">견적을 입력하세요.</div><div id="detail" class="small"></div><button id="copy">비교 결과 복사</button></section><section class="card links"><b>계약 전 같이 확인</b><br><a href="/quote-workshop/built-in-closet-cost.html">붙박이장 예상 비용 →</a><br><a href="/quote-workshop/built-in-closet-removal-cost.html">기존 붙박이장 철거 비용 →</a><br><a href="/quote-workshop/interior-film-cost.html">인테리어 필름 비용 →</a><br><a href="/quote-workshop/">다른 생활 견적 도구 →</a> · <a href="/">바로툴 →</a></section></main><script>const items=['실측 길이·높이 명시','철거·폐기 포함','내부 서랍·선반 구성 명시','도어·손잡이 자재명 명시','몰딩·걸레받이 마감 포함','A/S 기간 명시','운반·양중비 포함','현장 추가금 기준 명시'];let g=document.getElementById('grid');for(let i=1;i<=3;i++)g.innerHTML+=`<div class="q" id="q${i}"><b>업체 ${i}</b><input id="p${i}" type="number" min="0" step="10000" placeholder="총 견적 원"><input id="m${i}" type="number" min="0.1" step="0.1" placeholder="설치 길이 m">${items.map((x,j)=>`<label><input type="checkbox" id="c${i}_${j}"> ${x}</label>`).join('')}<div id="s${i}" class="small"></div></div>`;let summary='';function calc(){let rows=[];for(let i=1;i<=3;i++){let p=+document.getElementById('p'+i).value||0,m=+document.getElementById('m'+i).value||0,n=items.filter((_,j)=>document.getElementById(`c${i}_${j}`).checked).length,unit=p&&m?p/m:Infinity,risk=items.length-n,score=p?p+risk*40000:Infinity;rows.push({i,p,m,n,unit,risk,score});document.getElementById('s'+i).textContent=p?`포함 ${n}/8 · 누락위험 ${risk}개${m?' · m당 '+Math.round(unit).toLocaleString()+'원':''}`:'';document.getElementById('q'+i).classList.remove('best')}let valid=rows.filter(x=>x.p);if(!valid.length){result.textContent='견적을 입력하세요.';detail.textContent='';summary='';return}valid.sort((a,b)=>a.score-b.score);let b=valid[0];document.getElementById('q'+b.i).classList.add('best');result.textContent=`업체 ${b.i}가 총액과 명시조건을 함께 볼 때 가장 유리합니다.`;summary=`업체 ${b.i}: 총액 ${b.p.toLocaleString()}원, 포함조건 ${b.n}/8, 누락위험 ${b.risk}개${b.m?', m당 '+Math.round(b.unit).toLocaleString()+'원':''}`;detail.textContent=summary+' · 특히 실측 치수, 자재 브랜드·등급, 내부 구성 도면, 철거·폐기, 운반·양중, 추가금 발생 조건과 A/S를 계약서에 남기세요.'}document.addEventListener('input',calc);document.getElementById('copy').onclick=()=>summary&&navigator.clipboard.writeText('붙박이장 견적 비교 결과\n'+summary+'\n계약 전: 실측·자재명·내부구성·철거폐기·운반양중·추가금·A/S 확인');</script></body></html>
