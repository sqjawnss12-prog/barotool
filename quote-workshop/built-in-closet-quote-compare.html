<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>붙박이장 업체 3곳 견적 비교 2026 | 견적공방</title><meta name="description" content="붙박이장 업체 3곳 견적을 총액, 설치 길이, 철거·폐기, 내부 구성, 마감, A/S 조건까지 같은 기준으로 비교합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/built-in-closet-quote-compare.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#211d19}.w{max-width:960px;margin:auto;padding:24px}a{color:#7b3e20}.hero{padding:28px 0}.card{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.q{background:#faf8f4;border-radius:14px;padding:14px}.q input[type=number]{width:100%;padding:10px;margin:6px 0 10px;border:1px solid #d9d2c6;border-radius:9px}.q label{display:block;font-size:13px;margin:6px 0}.best{outline:3px solid #a4562a}.result{font-size:18px;font-weight:800}.small{font-size:13px;color:#706a62;line-height:1.6}.links{line-height:2}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a><section class="hero"><small>2026 붙박이장 견적 비교</small><h1>붙박이장 업체 3곳 견적 비교</h1><p>총액뿐 아니라 설치 길이당 가격과 철거·폐기·내부구성·마감·A/S 포함 여부를 함께 봅니다.</p></section><section class="card"><h2>업체별 견적 입력</h2><div class="grid" id="grid"></div><p class="small">길이는 같은 벽면 기준으로 입력하세요. 조건보정값은 누락 조건 확인을 돕는 비교용 값이며 실제 시공가치를 보장하지 않습니다.</p></section><section class="card"><h2>비교 결과</h2><div id="result" class="result">견적을 입력하세요.</div><div id="detail" class="small"></div></section><section class="card links"><b>같이 보기</b><br><a href="/quote-workshop/built-in-closet-cost.html">붙박이장 예상 비용 →</a><br><a href="/quote-workshop/built-in-closet-removal-cost.html">기존 붙박이장 철거 비용 →</a><br><a href="/quote-workshop/interior-film-cost.html">인테리어 필름 비용 →</a><br><a href="/quote-workshop/">다른 생활 견적 도구 →</a> · <a href="/">바로툴 →</a></section></main><script>const items=['실측 길이·높이 명시','철거·폐기 비용 포함','내부 서랍·선반 구성 명시','도어·손잡이 자재명 명시','몰딩·걸레받이 마감 포함','A/S 기간 명시'];let g=document.getElementById('grid');for(let i=1;i<=3;i++){g.innerHTML+=`<div class="q" id="q${i}"><b>업체 ${i}</b><input id="p${i}" type="number" min="0" step="10000" placeholder="총 견적 원"><input id="m${i}" type="number" min="0.1" step="0.1" placeholder="설치 길이 m">${items.map((x,j)=>`<label><input type="checkbox" id="c${i}_${j}"> ${x}</label>`).join('')}<div id="s${i}" class="small"></div></div>`}function calc(){let rows=[];for(let i=1;i<=3;i++){let p=+document.getElementById('p'+i).value||0,m=+document.getElementById('m'+i).value||0,n=items.filter((_,j)=>document.getElementById(`c${i}_${j}`).checked).length,unit=p&&m?p/m:Infinity,adj=p?Math.max(0,p-n*30000):Infinity;rows.push({i,p,m,n,unit,adj});document.getElementById('s'+i).textContent=p?`포함 ${n}/6${m?' · m당 '+Math.round(unit).toLocaleString()+'원':''}`:'';document.getElementById('q'+i).classList.remove('best')}let valid=rows.filter(x=>x.p);if(!valid.length){result.textContent='견적을 입력하세요.';detail.textContent='';return}valid.sort((a,b)=>a.adj-b.adj);let b=valid[0];document.getElementById('q'+b.i).classList.add('best');result.textContent=`업체 ${b.i}의 조건 대비 견적이 가장 유리합니다.`;detail.textContent=`총액 ${b.p.toLocaleString()}원 · 핵심 포함조건 ${b.n}/6${b.m?' · m당 '+Math.round(b.unit).toLocaleString()+'원':''}. 계약 전 실측 치수, 자재명, 내부 구성, 철거·폐기, 추가금과 A/S를 서면 견적에 남기세요.`}document.addEventListener('input',calc);</script></body></html>
