<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현관 중문 업체 3곳 견적 비교 2026 | 견적공방</title><meta name="description" content="3연동·원슬라이딩 현관 중문 업체 3곳의 견적을 총액뿐 아니라 철거, 목공, 유리, 댐퍼, A/S 포함조건까지 같은 기준으로 비교합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/entrance-middle-door-quote-compare.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#211d19}.w{max-width:960px;margin:auto;padding:24px}a{color:#7b3e20}.hero{padding:28px 0}.card{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.q{background:#faf8f4;border-radius:14px;padding:14px}.q input{width:100%;padding:10px;margin:6px 0 10px;border:1px solid #d9d2c6;border-radius:9px}.q label{display:block;font-size:13px;margin:6px 0}.best{outline:3px solid #a4562a}.result{font-size:18px;font-weight:800}.small{font-size:13px;color:#706a62;line-height:1.6}.links{line-height:2}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a><section class="hero"><small>2026 중문 견적 비교</small><h1>현관 중문 업체 3곳 견적 비교</h1><p>싼 총액만 고르지 않고 실제 계약 때 빠지기 쉬운 철거·목공·유리·댐퍼·A/S 조건을 함께 점수화합니다.</p></section><section class="card"><h2>같은 사양으로 받은 견적 입력</h2><div class="grid" id="grid"></div><p class="small">포함 항목 1개당 비교점수에 5만원 상당의 가치를 반영해 단순 최저가보다 조건이 충실한 견적을 찾습니다. 실제 계약금액을 보장하는 기준은 아닙니다.</p></section><section class="card"><h2>비교 결과</h2><div id="result" class="result">견적을 입력하세요.</div><div id="detail" class="small"></div></section><section class="card links"><b>같이 보기</b><br><a href="/quote-workshop/entrance-middle-door-cost.html">현관 중문 예상 비용 계산 →</a><br><a href="/quote-workshop/entrance-door-replacement-cost.html">현관문 교체 비용 →</a><br><a href="/quote-workshop/">다른 생활 견적 도구 →</a><br><a href="/marketing/">마케팅셈 →</a> · <a href="/">바로툴 →</a></section></main><script>const items=['철거·폐기 포함','목공·마감 포함','강화유리 사양 명시','댐퍼/소프트클로징 포함','출장·실측비 포함','A/S 기간 명시'];let g=document.getElementById('grid');for(let i=1;i<=3;i++){g.innerHTML+=`<div class="q" id="q${i}"><b>업체 ${i}</b><input id="p${i}" type="number" min="0" step="10000" placeholder="총 견적 원">${items.map((x,j)=>`<label><input type="checkbox" id="c${i}_${j}"> ${x}</label>`).join('')}<div id="s${i}" class="small"></div></div>`}function calc(){let rows=[];for(let i=1;i<=3;i++){let p=+document.getElementById('p'+i).value||0,n=items.filter((_,j)=>document.getElementById(`c${i}_${j}`).checked).length,adj=p?Math.max(0,p-n*50000):Infinity;rows.push({i,p,n,adj});document.getElementById('s'+i).textContent=p?`포함 ${n}/6 · 조건보정 비교값 ${adj.toLocaleString()}원`:'';document.getElementById('q'+i).classList.remove('best')}let valid=rows.filter(x=>x.p);if(!valid.length){result.textContent='견적을 입력하세요.';detail.textContent='';return}valid.sort((a,b)=>a.adj-b.adj);let b=valid[0];document.getElementById('q'+b.i).classList.add('best');result.textContent=`업체 ${b.i}의 조건 대비 견적이 가장 유리합니다.`;detail.textContent=`총액 ${b.p.toLocaleString()}원 · 핵심 포함조건 ${b.n}/6. 계약 전 제품 모델·프레임/유리 사양·추가금 발생조건을 견적서에 적어 달라고 요청하세요.`}document.addEventListener('input',calc);</script></body></html>
