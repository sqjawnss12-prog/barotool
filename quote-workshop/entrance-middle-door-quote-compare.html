<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>현관 중문 업체 3곳 견적 비교 2026 | 견적공방</title><meta name="description" content="3연동·원슬라이딩 현관 중문 업체 3곳의 견적을 총액, 철거, 목공, 유리, 댐퍼, A/S 포함조건으로 비교합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/entrance-middle-door-quote-compare.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#211d19}.w{max-width:960px;margin:auto;padding:24px}a{color:#7b3e20}.hero{padding:28px 0}.card{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.q{background:#faf8f4;border-radius:14px;padding:14px}.q input[type=number]{width:100%;padding:10px;margin:6px 0 10px}.q label{display:block;font-size:13px;margin:7px 0}.result{font-size:17px;line-height:1.8}.small{font-size:13px;color:#706a62;line-height:1.6}.links{line-height:2}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a><section class="hero"><small>2026 중문 견적 비교</small><h1>현관 중문 업체 3곳 견적 비교</h1><p>제품가만 보지 말고 실제 계약 때 빠지기 쉬운 철거·목공·유리·댐퍼·A/S 조건까지 같은 표에서 확인하세요.</p></section><section class="card"><h2>같은 사양으로 받은 견적 입력</h2><div class="grid" id="grid"></div><p class="small">총액과 포함조건은 서로 다른 정보이므로 임의의 금액으로 환산하지 않습니다. 가격이 낮아도 미확인 조건이 많다면 계약 전 추가금을 확인하세요.</p></section><section class="card"><h2>비교 결과</h2><div id="result" class="result">견적을 입력하세요.</div></section><section class="card links"><b>같이 보기</b><br><a href="/quote-workshop/entrance-middle-door-cost.html">현관 중문 예상 비용 계산 →</a><br><a href="/quote-workshop/entrance-door-replacement-cost.html">현관문 교체 비용 →</a><br><a href="/quote-workshop/">다른 생활 견적 도구 →</a><br><a href="/marketing/">마케팅셈 →</a> · <a href="/">바로툴 →</a></section></main><script>const items=['철거·폐기 포함','목공·마감 포함','유리 사양 명시','댐퍼/소프트클로징 포함','출장·실측비 포함','A/S 기간 명시'];let g=document.getElementById('grid');for(let i=1;i<=3;i++)g.innerHTML+=`<div class="q"><b>업체 ${i}</b><input id="p${i}" type="number" min="0" step="10000" placeholder="총 견적 원">${items.map((x,j)=>`<label><input type="checkbox" id="c${i}_${j}"> ${x}</label>`).join('')}</div>`;function calc(){let rows=[];for(let i=1;i<=3;i++){let p=+document.getElementById('p'+i).value||0,n=items.filter((_,j)=>document.getElementById(`c${i}_${j}`).checked).length;if(p)rows.push({i,p,n})}if(!rows.length){result.textContent='견적을 입력하세요.';return}let cheapest=Math.min(...rows.map(x=>x.p));result.innerHTML=rows.map(x=>`<b>업체 ${x.i}</b> — ${x.p.toLocaleString()}원${x.p===cheapest?' (입력 견적 최저)':''} · 포함조건 ${x.n}/6${x.n<6?` · 미확인 ${6-x.n}개`:''}`).join('<br>')+'<p class="small">최저가 표시는 입력한 총액만 비교합니다. 포함조건 수는 별도로 표시하며 시공 품질이나 업체 신뢰도를 평가하지 않습니다.</p>'}document.addEventListener('input',calc);</script></body></html>
