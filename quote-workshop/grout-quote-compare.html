<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>줄눈 시공 업체 3곳 견적 비교 2026 | 견적공방</title><meta name="description" content="욕실·현관·베란다 줄눈 시공 업체 3곳 견적을 총액, 시공범위, 기존 백시멘트 제거, 재료, 보수, A/S 조건까지 같은 기준으로 비교합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/grout-quote-compare.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#211d19}.w{max-width:960px;margin:auto;padding:24px}a{color:#7b3e20}.hero{padding:28px 0}.card{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.q{background:#faf8f4;border-radius:14px;padding:14px}.q input{width:100%;padding:10px;margin:6px 0 10px;border:1px solid #d9d2c6;border-radius:9px}.q label{display:block;font-size:13px;margin:6px 0}.best{outline:3px solid #a4562a}.result{font-size:18px;font-weight:800}.small{font-size:13px;color:#706a62;line-height:1.6}.links{line-height:2}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a><section class="hero"><small>2026 줄눈 견적 비교</small><h1>줄눈 시공 업체 3곳 견적 비교</h1><p>총액만 비교하지 않고 시공범위·기존 줄눈 제거·재료·보수·A/S까지 같은 기준으로 비교합니다.</p></section><section class="card"><h2>업체별 견적 입력</h2><div class="grid" id="grid"></div><p class="small">포함 항목은 가격과 별도로 표시해 누락 조건을 찾는 용도입니다. 조건보정값은 비교 편의를 위한 참고값이며 실제 시공가치를 보장하지 않습니다.</p></section><section class="card"><h2>비교 결과</h2><div id="result" class="result">견적을 입력하세요.</div><div id="detail" class="small"></div></section><section class="card links"><b>같이 보기</b><br><a href="/quote-workshop/grout-installation-cost.html">줄눈 시공 예상 비용 →</a><br><a href="/quote-workshop/new-apartment-grout-package-cost.html">신축 입주 줄눈 패키지 비용 →</a><br><a href="/quote-workshop/move-in-cleaning-cost.html">입주청소 비용 →</a><br><a href="/quote-workshop/">다른 생활 견적 도구 →</a> · <a href="/">바로툴 →</a></section></main><script>const items=['시공 공간·면적 명시','기존 백시멘트 제거 포함','줄눈 재료·제품명 명시','곰팡이·오염 전처리 포함','하자 보수 조건 명시','A/S 기간 명시'];let g=document.getElementById('grid');for(let i=1;i<=3;i++){g.innerHTML+=`<div class="q" id="q${i}"><b>업체 ${i}</b><input id="p${i}" type="number" min="0" step="10000" placeholder="총 견적 원">${items.map((x,j)=>`<label><input type="checkbox" id="c${i}_${j}"> ${x}</label>`).join('')}<div id="s${i}" class="small"></div></div>`}function calc(){let rows=[];for(let i=1;i<=3;i++){let p=+document.getElementById('p'+i).value||0,n=items.filter((_,j)=>document.getElementById(`c${i}_${j}`).checked).length,adj=p?Math.max(0,p-n*20000):Infinity;rows.push({i,p,n,adj});document.getElementById('s'+i).textContent=p?`포함 ${n}/6 · 조건보정 비교값 ${adj.toLocaleString()}원`:'';document.getElementById('q'+i).classList.remove('best')}let valid=rows.filter(x=>x.p);if(!valid.length){result.textContent='견적을 입력하세요.';detail.textContent='';return}valid.sort((a,b)=>a.adj-b.adj);let b=valid[0];document.getElementById('q'+b.i).classList.add('best');result.textContent=`업체 ${b.i}의 조건 대비 견적이 가장 유리합니다.`;detail.textContent=`총액 ${b.p.toLocaleString()}원 · 핵심 포함조건 ${b.n}/6. 계약 전 시공 위치·재료명·기존 줄눈 제거 범위·추가금·A/S를 견적서에 적어 달라고 요청하세요.`}document.addEventListener('input',calc);</script></body></html>
