<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 인덕션 설치 추가비 계산기 | 견적공방</title><meta name="description" content="인덕션 설치 전용선·차단기·콘센트·가스막음·상판 타공 등 추가비 항목을 계산하고 견적 누락을 확인하세요."><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#201d19}.w{max-width:760px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:22px;margin:16px 0}label{display:block;margin:14px 0 5px;font-weight:700}select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}.sum{font-size:28px;font-weight:900;color:#8a451f}.note{font-size:13px;color:#70685e;line-height:1.65}a{color:#7b3e20;font-weight:700}</style></head><body><main class="w"><p><a href="/quote-workshop/">← 견적공방</a></p><h1>인덕션 설치 추가비 계산기</h1><p>제품 가격과 별개로 생길 수 있는 전기·상판 작업을 먼저 확인합니다.</p><div class="box"><label>전용선 공사</label><select id="wire"><option value="0">불필요/확인 전</option><option value="100000">노출 배선 10m 이하 — 100,000원</option><option value="350000">매립 배선 10m 이하 — 350,000원</option></select><label>전용 차단기</label><select id="breaker"><option value="0">불필요</option><option value="28000">필요 — 28,000원</option></select><label>콘센트 신설</label><select id="outlet"><option value="0">불필요</option><option value="15000">필요 — 15,000원</option></select><label>도시가스 막음</label><select id="gas"><option value="0">불필요</option><option value="10000">필요 — 10,000원</option></select><label>상판 타공·메움 등 현장 견적</label><input id="top" type="number" min="0" step="10000" value="0" inputmode="numeric"><p>입력 항목 합계</p><div class="sum" id="sum">0원</div></div><div class="box note"><b>계산 기준</b><br>전용선·차단기·콘센트·가스 막음 금액은 2026년 공개된 삼성 전기레인지 추가 설치비 기준을 참고한 비교용 값입니다. 상판 재질·타공 크기·배선 거리·현장 상태에 따라 실제 견적은 달라질 수 있으므로 계약 전 서면 견적을 확인하세요.</div><div class="box"><b>같이 확인하면 좋은 무료 도구</b><p><a href="/quote-workshop/moving-quote-compare.html">포장이사 3사 견적 비교 →</a></p><p><a href="/quote-workshop/aircon-relocation-quote-compare.html">에어컨 이전설치 견적 비교 →</a></p><p><a href="/qr/">QR공방 →</a> · <a href="/">바로툴 →</a></p></div></main><script>const ids=['wire','breaker','outlet','gas','top'];function calc(){let n=ids.reduce((s,id)=>s+(Number(document.getElementById(id).value)||0),0);document.getElementById('sum').textContent=n.toLocaleString('ko-KR')+'원'}ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));calc()</script></body></html>
