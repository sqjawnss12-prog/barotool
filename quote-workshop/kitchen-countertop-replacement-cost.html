<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>싱크대 상판 교체 비용 계산기 2026</title><meta name="description" content="싱크대 상판 길이와 재질, 철거 및 타공 조건으로 교체 예상비를 계산합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/kitchen-countertop-replacement-cost.html"><style>body{font-family:system-ui;background:#f5f3ee;color:#222;margin:auto;max-width:760px;padding:24px}main{background:#fff;padding:24px;border-radius:18px}label{display:block;font-weight:700;margin-top:15px}input,select,button{width:100%;padding:12px;margin-top:6px;box-sizing:border-box}#out{font-size:25px;font-weight:800;margin:22px 0}a{color:#7b3e20}</style></head><body><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a><main><h1>싱크대 상판 교체 비용 계산기</h1><p>전체 싱크대가 아니라 상판만 교체할 때 길이·재질·철거 조건을 비교합니다.</p><label>상판 길이(m)<input id="len" type="number" value="3" min="1" step="0.1"></label><label>재질<select id="mat"><option value="0">인조대리석</option><option value="1">엔지니어드스톤</option><option value="2">세라믹·천연석</option></select></label><label>기존 상판 철거·폐기<select id="rm"><option value="0">별도 없음</option><option value="120000" selected>포함</option></select></label><label>추가 타공·가공비<input id="extra" type="number" value="0" step="10000"></label><div id="out"></div><p>견적서에서는 상판 자재·시공 외에 철거·폐기, 싱크볼/쿡탑 탈부착 및 타공, 수전·배관 재연결, 실리콘 마감 포함 여부를 확인하세요.</p><p><a href="/quote-workshop/induction-installation-cost.html">인덕션 설치 비용도 계산하기 →</a></p><small>공개 견적 사례를 예산용 범위로 단순화했습니다. 실제 금액은 브랜드·두께·폭·현장 가공에 따라 달라집니다.</small></main><script>const rates=[[100000,180000],[180000,320000],[250000,500000]],$=x=>document.getElementById(x);function c(){let l=Math.max(1,+$('len').value||1),r=rates[+$('mat').value],f=(+$('rm').value||0)+Math.max(0,+$('extra').value||0),w=n=>Math.round(n).toLocaleString('ko-KR')+'원';$('out').textContent=w(l*r[0]+f)+' ~ '+w(l*r[1]+f)}document.querySelectorAll('input,select').forEach(e=>e.oninput=c);c()</script></body></htm
