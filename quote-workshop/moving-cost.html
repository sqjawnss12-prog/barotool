<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포장이사 비용 계산기 2026 | 원룸·투룸·아파트 견적 비교</title><meta name="description" content="원룸·투룸·아파트 포장이사·반포장이사 예상비용과 사다리차·에어컨 이전 등 추가비용을 계산하고 받은 견적과 비교합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/moving-cost.html"><style>body{font-family:system-ui;margin:0;background:#f7f5f1;color:#29251f}.w{max-width:760px;margin:auto;padding:28px 18px}a{color:#7b3e20}.card{background:white;padding:22px;border-radius:18px;margin:16px 0;box-shadow:0 4px 20px #0001}label{display:block;margin:12px 0 5px;font-weight:700}select,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:12px;background:#7b3e20;color:white;font-weight:800}.result{font-size:20px;font-weight:800}.muted{color:#706a61;font-size:14px;line-height:1.65}</style></head><body><main class="w"><p><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a></p><h1>포장이사 비용 계산기</h1><p>집 규모와 이사 방식, 추가 작업을 넣어 예상 견적 범위를 확인하세요.</p><div class="card"><label>집 규모</label><select id="size"><option value="1">원룸·오피스텔 (1톤)</option><option value="2">투룸·소형 (2.5톤)</option><option value="3">24~29평 (3.5톤)</option><option value="4">30~34평 (5톤)</option></select><label>이사 방식</label><select id="type"><option value="1">포장이사</option><option value=".75">반포장이사</option></select><label>시기</label><select id="season"><option value="1">평일·비수기</option><option value="1.25">주말·성수기</option><option value="1.45">손없는 날 등 수요 집중일</option></select><label>사다리차/엘리베이터 등 추가비 (원)</label><input id="extra" type="number" value="0" step="10000"><label>실제로 받은 견적 (선택, 원)</label><input id="quote" type="number" placeholder="예: 1200000"><button onclick="calc()">예상 비용 계산</button></div><div class="card" id="out"><span class="muted">조건을 입력하고 계산하세요.</span></div><div class="card"><h2>어떻게 봐야 하나요?</h2><p class="muted">공개된 2026년 이사 비용 자료의 규모별 범위를 기준점으로 사용합니다. 실제 가격은 짐 양, 이동거리, 층수, 사다리차, 에어컨·가전 이전, 날짜와 지역에 따라 크게 달라질 수 있으므로 방문견적 전 예산 확인용으로 사용하세요. 여러 업체의 세부 견적서를 같은 조건으로 비교하는 것이 좋습니다.</p><p><a href="/quote-workshop/">청소·설치·수리 견적 계산기도 보기 →</a></p></div></main><script>const ranges=[[300000,450000],[500000,700000],[800000,1100000],[1100000,1400000]];function won(n){return Math.round(n/10000).toLocaleString()+"만원"}function calc(){let r=ranges[+size.value-1],m=+type.value*+season.value,e=+extra.value||0,lo=r[0]*m+e,hi=r[1]*m+e,q=+quote.value||0,s=`<div class=result>예상 ${won(lo)} ~ ${won(hi)}</div><p class=muted>추가비 포함 예상 범위입니다.</p>`;if(q)s+=`<p><b>받은 견적 ${won(q)}</b> — ${q<lo?'기준 범위보다 낮음':q>hi?'기준 범위보다 높음':'기준 범위 안'}</p>`;out.innerHTML=s}</script></body></html>
