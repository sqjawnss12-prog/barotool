<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포장이사 업체 3곳 견적 비교 2026 | 견적공방</title><meta name="description" content="포장이사 업체 3곳 견적을 총액, 차량톤수, 작업인원, 사다리차, 에어컨·가전 이전, 추가금과 파손보상 조건까지 같은 기준으로 비교합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/moving-quote-compare.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#211d19}.w{max-width:960px;margin:auto;padding:24px}a{color:#7b3e20}.hero{padding:28px 0}.card{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.q{background:#faf8f4;border-radius:14px;padding:14px}.q input[type=number]{width:100%;padding:10px;margin:6px 0;border:1px solid #d9d2c6;border-radius:9px}.q label{display:block;font-size:13px;margin:7px 0}.best{outline:3px solid #a4562a}.result{font-size:18px;font-weight:800}.small{font-size:13px;color:#706a62;line-height:1.6}.links{line-height:2}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a><section class="hero"><small>2026 포장이사 견적 비교</small><h1>포장이사 업체 3곳 견적 비교</h1><p>같은 이사 날짜·출발지·도착지 조건에서 총액만 보지 말고 차량, 인원, 사다리차, 이전설치와 추가금 조건을 같이 비교하세요.</p></section><section class="card"><h2>업체별 견적 입력</h2><div class="grid" id="grid"></div><p class="small">비교 점수는 누락 조건을 눈에 띄게 만드는 보조 지표입니다. 실제 업체 품질이나 최종 비용을 보장하지 않습니다.</p></section><section class="card"><h2>비교 결과</h2><div id="result" class="result">견적을 입력하세요.</div><div id="detail" class="small"></div></section><section class="card links"><b>이사 준비 같이 보기</b><br><a href="/quote-workshop/moving-cost-quote.html">이사 예상비용 계산 →</a><br><a href="/quote-workshop/moving-ladder-truck-cost.html">사다리차 비용 계산 →</a><br><a href="/quote-workshop/moving-quote-checklist.html">이사 견적 체크리스트 →</a><br><a href="/quote-workshop/aircon-relocation-cost.html">에어컨 이전설치 비용 →</a><br><a href="/quote-workshop/">다른 생활 견적 도구 →</a> · <a href="/">바로툴 →</a></section></main><script>const items=['차량 톤수·대수 명시','작업 인원 명시','사다리차/엘리베이터 비용 명시','에어컨·가전 이전 범위 명시','폐기물·특수짐 추가금 조건 명시','파손 보상·계약조건 명시'];let g=document.getElementById('grid');for(let i=1;i<=3;i++){g.innerHTML+=`<div class="q" id="q${i}"><b>업체 ${i}</b><input id="p${i}" type="number" min="0" step="10000" placeholder="총 견적 원">${items.map((x,j)=>`<label><input type="checkbox" id="c${i}_${j}"> ${x}</label>`).join('')}<div id="s${i}" class="small"></div></div>`}function calc(){let rows=[];for(let i=1;i<=3;i++){let p=+document.getElementById('p'+i).value||0,n=items.filter((_,j)=>document.getElementById(`c${i}_${j}`).checked).length,adj=p?Math.max(0,p-n*30000):Infinity;rows.push({i,p,n,adj});document.getElementById('s'+i).textContent=p?`확인된 조건 ${n}/6`:'';document.getElementById('q'+i).classList.remove('best')}let valid=rows.filter(x=>x.p);if(!valid.length){result.textContent='견적을 입력하세요.';detail.textContent='';return}valid.sort((a,b)=>a.adj-b.adj);let b=valid[0];document.getElementById('q'+b.i).classList.add('best');result.textContent=`업체 ${b.i}의 조건 대비 견적이 가장 유리합니다.`;detail.textContent=`총액 ${b.p.toLocaleString()}원 · 핵심 조건 ${b.n}/6 확인. 계약 전 차량·인원·사다리차·가전 이전·특수짐 추가금·파손 보상 범위를 서면으로 확정하세요.`}document.addEventListener('input',calc);</script></body></html>
