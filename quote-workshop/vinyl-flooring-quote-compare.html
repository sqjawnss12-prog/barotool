기본 시공비'],['remove','기존 장판 철거비'],['repair','바닥 보수비'],['move','짐/가구 이동비'],['edge','걸레받이·마감비'],['etc','기타·폐기물']];const g=document.getElementById('g');for(let i=0;i<3;i++){let h='<section class="c"><h2>업체 '+String.fromCharCode(65+i)+'</h2>';for(const [k,n] of fields)h+='<div class="row"><label>'+n+' (원)</label><input inputmode="numeric" id="'+k+i+'" placeholder="0"></div>';h+='<div class="row"><label>VAT 포함</label><select id="vat'+i+'"><option value="1">포함</option><option value="1.1">별도(+10%)</option></select></div></section>';g.insertAdjacentHTML('beforeend',h)}function num(id){return Number(document.getElementById(id).value.replace(/[^0-9]/g,''))||0}function calc(){let a=[];for(let i=0;i<3;i++){let s=fields.reduce((t,f)=>t+num(f[0]+i),0)*Number(document.getElementById('vat'+i).value);a.push({i,s})}a.sort((x,y)=>x.s-y.s);document.getElementById('r').innerHTML='<b>입력 기준 최저 총액: 업체 '+String.fromCharCode(65+a[0].i)+' · '+Math.round(a[0].s).toLocaleString('ko-KR')+'원</b><br>'+a.map(x=>'업체 '+String.fromCharCode(65+x.i)+': '+Math.round(x.s).toLocaleString('ko-KR')+'원').join('<br>')+'<br><small>가격만으로 업체 품질을 판단할 수 없습니다. 동일한 자재·작업 범위인지 확인한 뒤 비교하세요.</small>'}</script></body></html>
