:76000,re:41000,out:34000},small:{move:94000,re:50000,out:39000},large:{move:117000,re:66000,out:50000},one:{move:245000,re:142000,out:104000},combo:{move:189000,re:103000,out:92000}};function c(){const v=r[type.value][svc.value]+Math.max(0,+extra.value||0);result.textContent=v.toLocaleString('ko-KR')+'원'}document.querySelectorAll('select,input').forEach(e=>e.oninput=c);c()</script></body></html>
