<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방충망 교체 견적 비교 계산기 | 3곳 가격 비교</title><meta name="description" content="방충망 교체 업체 3곳 견적을 창 개수, 망 종류, 시공비, 출장비 기준으로 비교하고 적정 견적을 확인합니다."><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/quote-workshop/window-screen-quote-compare.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f3ee;color:#1d1c19}.w{max-width:820px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #e5dfd4;border-radius:18px;padding:20px;margin:16px 0}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1d1c19;color:#fff;font-weight:700;font-size:16px;margin-top:14px}.result{font-size:18px;line-height:1.8}.muted{color:#746e65;font-size:14px;line-height:1.65}a{color:#8a421f}</style></head><body><main class="w"><p><a href="/quote-workshop/">← 견적공방</a> · <a href="/">바로툴</a></p><h1>방충망 교체 업체 3곳 견적 비교</h1><p class="muted">총액만 비교하지 않고 망 종류와 창 개수를 맞춘 뒤 창당 비용을 비교합니다. 2026 공개 가격 자료를 참고한 비교용 도구이며 실제 현장가는 지역·창 크기·창틀 상태에 따라 달라집니다.</p><section class="box"><label>망 종류</label><select id="type"><option value="poly">일반 폴리에스터</option><option value="alu">알루미늄</option><option value="fine">미세/스테인리스 방진망</option><option value="security">방범 방충망</option></select><label>교체 창 개수</label><input id="count" type="number" min="1" value="4"><label>업체 A 총견적 (원)</label><input id="a" type="number" value="180000"><label>업체 B 총견적 (원)</label><input id="b" type="number" value="220000"><label>업체 C 총견적 (원)</label><input id="c" type="number" value="260000"><button onclick="calc()">견적 비교하기</button></section><section class="box result" id="out">조건을 입력하고 비교해 보세요.</section><section class="box"><b>견적 받을 때 확인할 항목</b><p class="muted">① 망 자재 종류와 규격 ② 기존 망 철거 포함 여부 ③ 창당 시공비 ④ 출장비 ⑤ 창틀·롤러 보수 추가금 ⑥ 부가세 포함 여부를 동일 조건으로 맞추세요.</p><p><a href="/quote-workshop/window-screen-replacement-cost.html">방충망 교체 예상비 계산 →</a><br><a href="/quote-workshop/fine-mesh-screen-cost.html">미세방충망 비용 계산 →</a></p></section></main><script>function won(n){return Math.round(n).toLocaleString('ko-KR')+'원'}function calc(){const n=Math.max(1,+count.value||1), vals=[['A',+a.value||0],['B',+b.value||0],['C',+c.value||0]].filter(x=>x[1]>0).sort((x,y)=>x[1]-y[1]);if(!vals.length){out.textContent='견적 금액을 입력하세요.';return}const lo=vals[0],hi=vals[vals.length-1],gap=hi[1]-lo[1];out.innerHTML='<b>가장 낮은 견적: 업체 '+lo[0]+' '+won(lo[1])+'</b><br>창당 '+won(lo[1]/n)+' · 최고 견적과 '+won(gap)+' 차이<br><span class="muted">가격만으로 결정하지 말고 망 재질·철거·출장비·보수 범위가 같은지 확인하세요. 특히 미세망·방범망은 일반망과 자재 및 시공 난도가 달라 단순 총액 비교가 적절하지 않습니다.</span>'}</script></body></html>
