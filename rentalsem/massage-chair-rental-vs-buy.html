<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안마의자 렌탈 vs 구매 계산기 2026 | 렌탈셈</title><meta name="description" content="안마의자 렌탈 월요금, 약정기간, 카드할인, 구매가, 유지비와 잔존가치를 넣어 총비용을 비교하는 무료 계산기."><meta name="robots" content="index,follow"><link rel="canonical" href="https://barotool.sqjawnss12.workers.dev/rentalsem/massage-chair-rental-vs-buy.html"><style>body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;background:#f6f8fb;color:#17202a}.w{max-width:900px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between}.nav a{color:#245fd6;text-decoration:none}.card{background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #cfd8e3;border-radius:10px;font-size:16px;box-sizing:border-box}.metric{background:#f6f8fb;border-radius:12px;padding:14px}.metric b{display:block;font-size:22px;margin-top:4px}.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.winner{margin-top:12px;padding:14px;background:#eaf4ff;border-radius:12px;font-weight:800}h1{font-size:38px;line-height:1.2}.small{font-size:12px;color:#6b7785}.links a{color:#2056c7}@media(max-width:700px){.grid,.result{grid-template-columns:1fr}h1{font-size:31px}}</style></head><body><main class="w"><nav class="nav"><b>렌탈셈</b><div><a href="/rentalsem/">정수기 계산기</a> · <a href="/">바로툴</a></div></nav><h1>안마의자 렌탈 vs 구매<br>총비용 계산기</h1><p>월 렌탈료만 비교하지 않고 약정 전체 납부액과 구매 후 유지비·잔존가치를 같은 기간으로 맞춰 비교합니다.</p><section class="card"><div class="grid"><div class="field"><label>월 렌탈료</label><input id="rent" type="number" value="59900"></div><div class="field"><label>약정기간(개월)</label><input id="months" type="number" value="60"></div><div class="field"><label>월 카드 할인</label><input id="card" type="number" value="0"></div><div class="field"><label>구매가</label><input id="buy" type="number" value="3000000"></div><div class="field"><label>연간 유지·수리비</label><input id="maint" type="number" value="100000"></div><div class="field"><label>기간 종료 후 중고가치</label><input id="resale" type="number" value="500000"></div></div></section><section class="card"><div class="result"><div class="metric">렌탈 총비용<b id="rt">-</b></div><div class="metric">구매 총비용<b id="bt">-</b></div><div class="metric">차이<b id="diff">-</b></div><div class="metric">손익분기 월 렌탈료<b id="be">-</b></div></div><div class="winner" id="winner"></div><p class="small">실제 렌탈료·프로모션·소유권 이전 조건은 업체별로 다르므로 계약 전 확인하세요.</p></section><section class="card links"><b>같이 비교하기</b><br><a href="/rentalsem/">정수기 렌탈 vs 구매</a> · <a href="/rentalsem/air-purifier-rental-vs-buy.html">공기청정기 렌탈 vs 구매</a> · <a href="/quote-workshop/">견적공방</a> · <a href="/">바로툴</a></section></main><script>const ids=['rent','months','card','buy','maint','resale'];const n=id=>Math.max(0,Number(document.getElementById(id).value)||0),won=v=>Math.round(v).toLocaleString('ko-KR')+'원';function calc(){const m=Math.max(1,n('months')),r=Math.max(0,n('rent')-n('card'))*m,b=Math.max(0,n('buy')+n('maint')*(m/12)-n('resale')),d=Math.abs(r-b),be=b/m+n('card');rt.textContent=won(r);bt.textContent=won(b);diff.textContent=won(d);document.getElementById('be').textContent=won(be);winner.textContent=Math.abs(r-b)<1000?'현재 입력값에서는 총비용이 거의 같습니다.':r<b?'현재 조건에서는 렌탈이 약 '+won(d)+' 저렴합니다.':'현재 조건에서는 구매가 약 '+won(d)+' 저렴합니다.'}ids.forEach(x=>document.getElementById(x).addEventListener('input',calc));calc();</script></body></html>
