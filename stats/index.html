<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>바로툴 통합 방문 현황</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:34px 18px 70px}header{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}h1{margin:0;font-size:clamp(25px,4vw,38px)}p{color:#667085;margin:8px 0 0}.back{color:#2457d6;text-decoration:none;font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.sum,.card{background:#fff;border:1px solid #e6e9ef;border-radius:16px;box-shadow:0 4px 18px rgba(20,32,60,.05)}.sum{padding:18px}.sum span{display:block;color:#7b8494;font-size:13px}.sum b{display:block;font-size:27px;margin-top:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 12px}.toolbar small{color:#7b8494}.toolbar button{border:0;background:#172033;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:17px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-weight:800}.card a{color:#2457d6;text-decoration:none;font-size:13px}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.num{background:#f7f8fb;border-radius:11px;padding:11px}.num span{display:block;color:#7b8494;font-size:12px}.num b{font-size:19px}.error{color:#b42318;font-size:12px;margin-top:8px}@media(max-width:680px){.summary,.grid{grid-template-columns:1fr}.nums{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><main class="wrap"><header><div><h1>통합 방문 현황</h1><p>사이트별 오늘·어제·누적 페이지 조회수(PV)를 확인합니다.</p></div><a class="back" href="/">← 바로툴</a></header><section class="summary"><div class="sum"><span>오늘 전체</span><b id="sumToday">…</b></div><div class="sum"><span>어제 전체</span><b id="sumYesterday">…</b></div><div class="sum"><span>누적 전체</span><b id="sumTotal">…</b></div></section><div class="toolbar"><small id="updated">불러오는 중…</small><button id="refresh" type="button">새로고침</button></div><section id="grid" class="grid"></section></main>
<script>
const sites=[
 ['barotool','바로툴','/'],['marketing','마케팅셈','/marketing/'],['qr','QR공방','/qr/'],['quote-workshop','견적공방','/quote-workshop/'],['carvaluelab','차값랩','/carvaluelab/'],['stocksem','재고셈','/stocksem/'],['couponsem','쿠폰셈','/couponsem/'],['unitlab','단가랩','/unitlab/'],['doclab','문서랩','/doclab/'],['iconmaker','아이콘메이커','/iconmaker/'],['watermark','워터마크랩','/watermark/'],['powercost','와트비','/powercost/'],['curtainfit','커튼셈','/curtainfit/'],['petcost','반려동물 비용','/petcost/'],['roundsem','라운드셈','/roundsem/'],['rentalsem','렌탈셈','/rentalsem/'],['areafit','면적 도구','/areafit/'],['floorfit','바닥재 도구','/floorfit/'],['moldingfit','몰딩 도구','/moldingfit/'],['packfit','포장 도구','/packfit/'],['tilefit','타일 도구','/tilefit/'],['paintfit','페인트 도구','/paintfit/'],['wallfit','도배 도구','/wallfit/'],['tvfit','TV 도구','/tvfit/'],['filmfit','필름 도구','/filmfit/'],['monitorfit','모니터 도구','/monitorfit/'],['printfit','인쇄 도구','/printfit/']
];
const nf=new Intl.NumberFormat('ko-KR');
const grid=document.getElementById('grid');
function card([id,name,path]){const el=document.createElement('article');el.className='card';el.dataset.site=id;el.innerHTML=`<div class="top"><span class="name">${name}</span><a href="${path}">사이트 열기 →</a></div><div class="nums"><div class="num"><span>오늘</span><b data-k="today">…</b></div><div class="num"><span>어제</span><b data-k="yesterday">…</b></div><div class="num"><span>누적</span><b data-k="total">…</b></div></div>`;return el}
sites.forEach(s=>grid.append(card(s)));
async function load(){document.getElementById('updated').textContent='불러오는 중…';let sums={today:0,yesterday:0,total:0};await Promise.all(sites.map(async([id])=>{const el=grid.querySelector(`[data-site="${id}"]`);try{const r=await fetch(`/api/view-stats?site=${encodeURIComponent(id)}`,{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();['today','yesterday','total'].forEach(k=>{const v=Number(d[k]||0);el.querySelector(`[data-k="${k}"]`).textContent=nf.format(v);sums[k]+=v});}catch(e){el.insertAdjacentHTML('beforeend','<div class="error">통계를 불러오지 못했습니다.</div>')}}));document.getElementById('sumToday').textContent=nf.format(sums.today);document.getElementById('sumYesterday').textContent=nf.format(sums.yesterday);document.getElementById('sumTotal').textContent=nf.format(sums.total);document.getElementById('updated').textContent=`갱신 ${new Date().toLocaleString('ko-KR')}`}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
