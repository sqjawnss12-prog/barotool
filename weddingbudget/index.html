<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결혼예산 셈 | 결혼비용·웨딩홀·스드메 예산 계산기</title><meta name="description" content="웨딩홀, 스드메, 예물, 신혼여행 등 결혼 준비 항목별 예상비용을 입력해 총예산과 남은 예산을 계산합니다."><style>body{font-family:system-ui,sans-serif;margin:auto;max-width:760px;padding:24px;color:#202124}h1{font-size:30px}.box{padding:20px;border:1px solid #ddd;border-radius:16px;margin:18px 0}label{display:block;margin:12px 0}input{width:160px;padding:9px;border:1px solid #bbb;border-radius:8px}button{padding:11px 18px;border:0;border-radius:9px;background:#222;color:white;font-weight:700}.result{font-size:22px;font-weight:800;margin-top:15px}.links a{display:inline-block;margin:6px 12px 6px 0}small{color:#666}</style></head><body><h1>결혼예산 셈</h1><p>항목별 견적을 한곳에 넣어 결혼 준비 총액과 예산 초과 여부를 확인하세요. 특정 업체 가격을 추정하지 않고 직접 받은 견적만 계산합니다.</p><div class="box"><label>전체 예산 <input id="budget" type="number" min="0" value="3000"> 만원</label><label>웨딩홀·식대 <input class="cost" type="number" min="0"> 만원</label><label>스드메 <input class="cost" type="number" min="0"> 만원</label><label>예물·예복 <input class="cost" type="number" min="0"> 만원</label><label>신혼여행 <input class="cost" type="number" min="0"> 만원</label><label>가전·가구 <input class="cost" type="number" min="0"> 만원</label><label>기타 <input class="cost" type="number" min="0"> 만원</label><button onclick="calc()">계산하기</button><div id="out" class="result"></div></div><div class="box"><b>견적 받을 때 함께 확인할 것</b><p>웨딩홀은 대관료·식대·보증인원, 스드메는 추가금 조건, 여행은 항공·숙박·현지비용 포함 여부를 분리해 적으면 업체 간 비교가 쉬워집니다.</p></div><div class="links"><b>다른 무료 도구</b><br><a href="/">바로툴</a><a href="/marketingsem/">마케팅셈</a><a href="/qrgongbang/">QR공방</a><a href="/estimateworkshop/">견적공방</a></div><small>본 도구는 사용자가 입력한 금액을 합산하는 예산 관리 도구이며 실제 계약가격을 보장하지 않습니다.</small><script>function calc(){let total=[...document.querySelectorAll('.cost')].reduce((s,e)=>s+(+e.value||0),0),b=+document.getElementById('budget').value||0,d=b-total;document.getElementById('out').innerHTML=`입력 견적 합계 ${total.toLocaleString()}만원<br>${d>=0?'남은 예산':'초과 예산'} ${Math.abs(d).toLocaleString()}만원`}</script></body></html>
